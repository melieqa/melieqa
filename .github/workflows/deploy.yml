name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pushing the built site to gh-pages needs write access; the default token is
# read-only on many repositories.
permissions:
  contents: write

# A force-push to gh-pages from two overlapping runs can publish the older build.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    # composer.lock pins Symfony 8, which requires PHP >= 8.4.1. Anything lower
    # installs fine and then fatals when Jigsaw boots symfony/console.
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        tools: composer:v2
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    # No --ignore-platform-reqs: a future bump past the runner's PHP should fail
    # here, loudly, rather than halfway through the build.
    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Install NPM Dependencies
      run: npm ci
    # Runs vite build, which in turn runs the production Jigsaw build.
    - name: Build site
      run: npm run prod
    - name: Create CNAME File
      run: echo "melieqa.com" > build_production/CNAME
    - name: Stage Files
      run: git add -f build_production
    - name: Commit files
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git commit -m "Build for deploy"
    - name: Publish
      run: |
        git subtree split --prefix build_production -b gh-pages
        git push -f origin gh-pages:gh-pages
        git branch -D gh-pages
